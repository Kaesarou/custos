server:
  port: 8080

spring:
  application:
    name: custos-node

  datasource:
    url: jdbc:postgresql://localhost:5432/custos
    username: custos
    password: custos

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

custos:
  node:
    id: local-node-1
    private-key: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    reward-address: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
    public-base-url: http://localhost:8080
    peers:
      - http://localhost:8082
      - http://localhost:8083
  api:
    base-path: /api/v1
  chains:
    31337:
      rpc-url: http://custos-test-chain:8545