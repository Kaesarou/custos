server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: custos-node

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/custos}
    username: ${SPRING_DATASOURCE_USERNAME:custos}
    password: ${SPRING_DATASOURCE_PASSWORD:custos}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

custos:
  node:
    id: ${CUSTOS_NODE_ID:}
    private-key: ${CUSTOS_NODE_PRIVATE_KEY:}
    reward-address: ${CUSTOS_NODE_REWARD_ADDRESS:}
    public-base-url: ${CUSTOS_NODE_PUBLIC_BASE_URL:}
    peers: ${CUSTOS_NODE_PEERS:}
  api:
    base-path: ${CUSTOS_API_BASE_PATH:/api/v1}
  chains:
    31337:
      rpc-url: ${CUSTOS_CHAIN_31337_RPC_URL:}